name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unzip project
        shell: pwsh
        run: Expand-Archive -Path medflow-offline-desktop.zip -DestinationPath app -Force
      - name: Install
        working-directory: app
        run: npm install
      - name: Build installer
        working-directory: app
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: MedFlow-Windows-Installer
          path: app/release/*.exe
